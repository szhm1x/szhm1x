<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Henderson Sánchez, Backend Developer Junior, Python y C++, Santo Domingo, República Dominicana" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#070a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#ff5a36" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff5a36" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8aa4ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="1.5" fill="#c9d1d9"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask">
      <circle cx="730" cy="165" r="118" fill="url(#fade)"/>
    </mask>
    <clipPath id="card"><rect x="1" y="1" width="898" height="398" rx="24"/></clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'SF Mono','Courier New',monospace; }
    .label { font-size: 10px; letter-spacing: 3px; fill: #8b9bb4; }
    .val   { font-size: 20px; font-weight: 700; fill: #e6edf3; }
    .ring  { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="400" fill="url(#bg)"/>
    <rect width="900" height="400" fill="url(#grid)"/>
    <rect width="900" height="400" fill="url(#glow)"/>

    <!-- decoración derecha -->
    <rect x="600" y="40" width="260" height="250" fill="url(#dots)" mask="url(#dotmask)"/>
    <circle cx="730" cy="165" r="122" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle class="ring" cx="730" cy="165" r="140" fill="none" stroke="#ff5a36" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="60 180 20 220"/>
    <circle class="ring" cx="730" cy="165" r="152" fill="none" stroke="#8aa4ff" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="30 260"/>

    <!-- cabecera -->
    <text x="40" y="46" class="label">SZHM1X / IDENTIDAD DEV</text>
    <text x="860" y="46" class="label" text-anchor="end" letter-spacing="1">@szhm1x</text>

    <!-- nombre -->
    <text x="40" y="104" font-size="12" letter-spacing="4" fill="#ff5a36">HOLA, MUNDO. SOY</text>
    <text x="40" y="168" font-size="64" font-weight="700" fill="#e6edf3">Henderson</text>
    <text x="40" y="236" font-size="64" font-weight="700" fill="#e6edf3">Sánchez</text>

    <!-- rol -->
    <text x="40" y="276" font-size="19" font-weight="700" fill="#ffffff">Backend Developer Junior<tspan fill="#ff5a36"> · </tspan><tspan fill="#8aa4ff" font-weight="400">Python</tspan><tspan fill="#ff5a36"> · </tspan><tspan fill="#8aa4ff" font-weight="400">C++</tspan></text>
    <text x="40" y="299" font-size="13" fill="#8b9bb4">Santo Domingo, República Dominicana</text>

    <!-- separador -->
    <line x1="40" y1="322" x2="860" y2="322" stroke="#ffffff" stroke-opacity="0.12"/>

    <!-- columnas -->
    <text x="40"  y="348" class="label">ENFOQUE</text>
    <circle cx="205" cy="344" r="3" fill="#ff5a36"/>
    <text x="40"  y="378" class="val">Backend</text>

    <text x="260" y="348" class="label">STACK</text>
    <circle cx="425" cy="344" r="3" fill="#ff5a36"/>
    <text x="260" y="378" class="val">Python · C++</text>

    <text x="480" y="348" class="label">ESTUDIA</text>
    <circle cx="645" cy="344" r="3" fill="#ff5a36"/>
    <text x="480" y="378" class="val">UNAPEC</text>

    <text x="700" y="348" class="label">ESTADO</text>
    <circle class="pulse" cx="860" cy="344" r="3.5" fill="#3fb950"/>
    <text x="700" y="378" class="val">Open to work</text>
  </g>
  <rect x="1" y="1" width="898" height="398" rx="24" fill="none" stroke="#ff5a36" stroke-opacity="0.25"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
